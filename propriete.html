<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propriété — HOMY Premium Real Estate</title>
<meta name="description" content="Découvrez le détail de cette propriété : photos, surface, chambres, prestations et quartier. HOMY Premium Real Estate, Casablanca et Marrakech.">
<meta name="theme-color" content="#0A1C2E">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A1C2E'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23C0A062' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="property">

<div data-header></div>

<main id="propertyRoot" class="page-offset">

  <!-- ======================================================= GALLERY -->
  <section class="gallery">
    <div class="gallery__stage" id="galleryStage"></div>

    <button type="button" class="gallery__nav gallery__nav--prev" id="galleryPrev" data-i18n-aria="a11y.prevImage">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <button type="button" class="gallery__nav gallery__nav--next" id="galleryNext" data-i18n-aria="a11y.nextImage">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 4l8 8-8 8"/></svg>
    </button>

    <div class="gallery__counter" id="galleryCounter"></div>
    <div class="gallery__thumbs" id="galleryThumbs"></div>
  </section>

  <!-- ======================================================== DETAIL -->
  <section class="section section--tight">
    <div class="container">
      <div class="detail">

        <!-- Main column -->
        <div>
          <header class="detail__header" data-reveal>
            <p class="detail__ref" id="propRef"></p>
            <h1 id="propTitle" style="font-size:clamp(2rem,5vw,3.2rem)"></h1>
            <p class="detail__place" id="propPlace"></p>
            <p class="detail__price" id="propPrice"></p>
          </header>

          <div class="specs" id="propSpecs" data-reveal></div>

          <div class="detail__block" data-reveal>
            <h2 data-i18n="property.description"></h2>
            <p id="propDescription"></p>
          </div>

          <div class="detail__block" data-reveal>
            <h2 data-i18n="property.finishes"></h2>
            <ul class="finish-list" id="propFinishes"></ul>
          </div>

          <div class="detail__block" data-reveal>
            <h2 data-i18n="property.neighbourhood"></h2>
            <p id="propNeighbourhood"></p>
          </div>

          <div class="btn-row">
            <a class="link-arrow" href="proprietes.html">
              <svg width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="currentColor" stroke-width="1.2" style="transform:rotate(180deg)"><path d="M0 5h18M14 1l4 4-4 4"/></svg>
              <span data-i18n="common.backToList"></span>
            </a>
          </div>
        </div>

        <!-- Sticky contact card -->
        <aside class="detail__aside">
          <div class="contact-card" data-reveal>
            <h3 data-i18n="property.contactTitle"></h3>
            <p data-i18n="property.contactText"></p>
            <a class="btn btn--whatsapp" id="propWhatsapp" href="#" target="_blank" rel="noopener" data-i18n="cta.whatsapp"></a>
            <a class="btn btn--ghost" href="contact.html" data-i18n="cta.button"></a>
            <div class="contact-card__phone">
              <span data-i18n="common.call"></span>
              <a id="propPhone" href="#"></a>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </section>

  <!-- ======================================================= SIMILAR -->
  <section class="section section--cream">
    <div class="container">
      <div class="section-head" data-reveal>
        <span class="eyebrow" data-i18n="property.similar"></span>
        <div class="rule"></div>
        <h2 data-i18n="property.similarText"></h2>
      </div>
      <div class="grid grid--3" id="similarGrid"></div>
    </div>
  </section>

</main>

<!-- ================================================ PROPERTY MISSING -->
<section class="section page-offset" id="propertyNotFound" hidden>
  <div class="container">
    <div class="empty-state">
      <h2 data-i18n="property.notFound.title"></h2>
      <p data-i18n="property.notFound.text"></p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn--outline" href="proprietes.html" data-i18n="common.viewAll"></a>
      </div>
    </div>
  </div>
</section>

<div data-footer></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/listings-backup.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
