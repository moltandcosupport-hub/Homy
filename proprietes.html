<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos propriétés — HOMY Premium Real Estate</title>
<meta name="description" content="Appartements, villas, penthouses et riads à vendre et à louer à Casablanca et Marrakech. Filtrez par ville, type de bien, budget et nombre de chambres.">
<meta name="theme-color" content="#0A1C2E">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A1C2E'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23C0A062' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="properties" data-title-key="properties.title">

<div data-header></div>

<!-- ===================================================== PAGE HEADER -->
<section class="page-hero">
  <div class="page-hero__media">
    <img src="https://images.unsplash.com/photo-1560185007-cde436f6a4d0?auto=format&fit=crop&w=1600&q=80"
         alt="" fetchpriority="high" decoding="async" width="1600" height="1067">
  </div>
  <div class="container">
    <nav class="breadcrumb" aria-label="Fil d'Ariane">
      <a href="index.html" data-i18n="nav.home"></a>
      <span>/</span>
      <span data-i18n="nav.properties"></span>
    </nav>
    <span class="eyebrow eyebrow--light" data-i18n="properties.eyebrow"></span>
    <h1 data-i18n="properties.title"></h1>
    <p data-i18n="properties.intro"></p>
  </div>
</section>

<!-- ========================================================= FILTERS -->
<section class="section section--tight">
  <div class="container">

    <form class="filters" id="filterForm" novalidate>
      <div class="filters__grid">
        <div class="field">
          <label class="field__label" for="f-status" data-i18n="search.status"></label>
          <select id="f-status" name="status"></select>
        </div>
        <div class="field">
          <label class="field__label" for="f-city" data-i18n="search.city"></label>
          <select id="f-city" name="city"></select>
        </div>
        <div class="field">
          <label class="field__label" for="f-type" data-i18n="search.type"></label>
          <select id="f-type" name="type"></select>
        </div>
        <div class="field">
          <label class="field__label" for="f-budget" data-i18n="search.budget"></label>
          <select id="f-budget" name="budget"></select>
        </div>
        <div class="field">
          <label class="field__label" for="f-rooms" data-i18n="search.rooms"></label>
          <select id="f-rooms" name="rooms"></select>
        </div>
      </div>

      <div class="filters__foot">
        <p class="results-count" id="resultsCount"></p>
        <div class="filters__actions">
          <div class="field">
            <label class="visually-hidden" for="f-sort" data-i18n="properties.sort"></label>
            <select id="f-sort" name="sort"></select>
          </div>
          <a href="#" class="reset-link" id="resetFilters" data-i18n="search.reset"></a>
        </div>
      </div>
    </form>

    <div class="grid grid--3" id="propertyGrid"></div>

    <div class="empty-state" id="emptyState" hidden>
      <h3 data-i18n="properties.empty.title"></h3>
      <p data-i18n="properties.empty.text"></p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn--outline" href="contact.html" data-i18n="cta.button"></a>
      </div>
    </div>

  </div>
</section>

<!-- ============================================================= CTA -->
<section class="section cta-band">
  <div class="cta-band__media">
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1600&q=80"
         alt="" loading="lazy" decoding="async" width="1600" height="1067">
  </div>
  <div class="container">
    <div data-reveal>
      <span class="eyebrow eyebrow--light" data-i18n="cta.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="cta.title"></h2>
      <p class="lead" style="margin-top:22px" data-i18n="cta.text"></p>
      <div class="btn-row">
        <a class="btn btn--gold" href="contact.html" data-i18n="cta.button"></a>
      </div>
    </div>
  </div>
</section>

<div data-footer></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/listings-backup.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
