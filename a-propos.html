<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À propos — HOMY Premium Real Estate</title>
<meta name="description" content="L'histoire de HOMY Premium Real Estate depuis 2019 : la fondatrice Rita Elliaoui, notre méthode et nos engagements à Casablanca et Marrakech.">
<meta name="theme-color" content="#0A1C2E">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A1C2E'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23C0A062' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="about" data-title-key="about.hero.title">

<div data-header></div>

<!-- ===================================================== PAGE HEADER -->
<section class="page-hero">
  <div class="page-hero__media">
    <img src="img/villa-ain-diab-07.jpg"
         alt="Coin petit-déjeuner, villa Aïn Diab" fetchpriority="high" decoding="async" width="1477" height="1065">
  </div>
  <div class="container">
    <nav class="breadcrumb" aria-label="Fil d'Ariane">
      <a href="index.html" data-i18n="nav.home"></a>
      <span>/</span>
      <span data-i18n="nav.about"></span>
    </nav>
    <span class="eyebrow eyebrow--light" data-i18n="about.hero.eyebrow"></span>
    <h1 data-i18n="about.hero.title"></h1>
    <p data-i18n="about.hero.text"></p>
  </div>
</section>

<!-- ========================================================= FOUNDER -->
<section class="section">
  <div class="container">
    <div class="founder">
      <div class="founder__media" data-reveal>
        <img src="img/rita-elliaoui.jpg"
             alt="Rita Elliaoui, fondatrice de HOMY Premium Real Estate"
             loading="lazy" decoding="async" width="660" height="880">
      </div>
      <div data-reveal data-reveal-delay="2">
        <span class="eyebrow" data-i18n="founder.eyebrow"></span>
        <div class="rule"></div>
        <p class="founder__quote" data-i18n="founder.quote"></p>
        <p class="founder__name" data-i18n="founder.name"></p>
        <p class="founder__role" data-i18n="founder.role"></p>
        <p class="lead" data-i18n="founder.text"></p>
      </div>
    </div>
  </div>
</section>

<!-- =========================================================== STORY -->
<section class="section section--cream">
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="about.story.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="about.story.title"></h2>
    </div>
    <div class="prose" data-reveal data-reveal-delay="2">
      <p data-i18n="about.story.p1"></p>
      <p data-i18n="about.story.p2"></p>
      <p data-i18n="about.story.p3"></p>
    </div>
  </div>
</section>

<!-- ========================================================== METHOD -->
<section class="section section--navy">
  <div class="container">
    <div class="split">
      <div data-reveal>
        <span class="eyebrow eyebrow--light" data-i18n="about.method.eyebrow"></span>
        <div class="rule"></div>
        <h2 data-i18n="about.method.title"></h2>
      </div>

      <div data-reveal data-reveal-delay="2">
        <div class="step">
          <div class="step__num">01</div>
          <h3 data-i18n="about.method.1.title"></h3>
          <p data-i18n="about.method.1.text"></p>
        </div>
        <div class="step">
          <div class="step__num">02</div>
          <h3 data-i18n="about.method.2.title"></h3>
          <p data-i18n="about.method.2.text"></p>
        </div>
        <div class="step">
          <div class="step__num">03</div>
          <h3 data-i18n="about.method.3.title"></h3>
          <p data-i18n="about.method.3.text"></p>
        </div>
        <div class="step">
          <div class="step__num">04</div>
          <h3 data-i18n="about.method.4.title"></h3>
          <p data-i18n="about.method.4.text"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ========================================================== VALUES -->
<section class="section">
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="about.values.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="about.values.title"></h2>
    </div>

    <div class="grid grid--4">
      <article class="feature" data-reveal data-reveal-delay="1">
        <div class="feature__num">01</div>
        <h3 data-i18n="about.values.1.title"></h3>
        <p data-i18n="about.values.1.text"></p>
      </article>
      <article class="feature" data-reveal data-reveal-delay="2">
        <div class="feature__num">02</div>
        <h3 data-i18n="about.values.2.title"></h3>
        <p data-i18n="about.values.2.text"></p>
      </article>
      <article class="feature" data-reveal data-reveal-delay="3">
        <div class="feature__num">03</div>
        <h3 data-i18n="about.values.3.title"></h3>
        <p data-i18n="about.values.3.text"></p>
      </article>
      <article class="feature" data-reveal data-reveal-delay="4">
        <div class="feature__num">04</div>
        <h3 data-i18n="about.values.4.title"></h3>
        <p data-i18n="about.values.4.text"></p>
      </article>
    </div>
  </div>
</section>

<!-- ============================================================= CTA -->
<section class="section cta-band">
  <div class="cta-band__media">
    <img src="img/villa-ain-diab-04.jpg"
         alt="" loading="lazy" decoding="async" width="1535" height="1024">
  </div>
  <div class="container">
    <div data-reveal>
      <span class="eyebrow eyebrow--light" data-i18n="cta.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="cta.title"></h2>
      <p class="lead" style="margin-top:22px" data-i18n="cta.text"></p>
      <div class="btn-row">
        <a class="btn btn--gold" href="contact.html" data-i18n="cta.button"></a>
        <a class="btn btn--ghost" href="proprietes.html" data-i18n="common.viewAll"></a>
      </div>
    </div>
  </div>
</section>

<div data-footer></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/listings-backup.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
