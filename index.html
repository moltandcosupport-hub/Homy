<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOMY Premium Real Estate — Immobilier d'exception à Casablanca et Marrakech</title>
<meta name="description" content="Vente et location d'appartements haut de gamme à Casablanca et Marrakech. Emplacements recherchés, prestations d'exception et accompagnement sur mesure. HOMY Premium Real Estate.">
<meta name="theme-color" content="#0A1C2E">

<meta property="og:type" content="website">
<meta property="og:title" content="HOMY Premium Real Estate">
<meta property="og:description" content="L'immobilier d'exception au Maroc. Casablanca · Marrakech.">
<meta property="og:image" content="img/villa-ain-diab-01.jpg">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A1C2E'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23C0A062' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<link rel="preload" as="image" href="img/villa-ain-diab-01.jpg">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="home">

<div data-header data-header-transparent></div>

<!-- ============================================================ HERO -->
<section class="hero">
  <div class="hero__media">
    <img src="img/villa-ain-diab-01.jpg"
         alt="Villa avec piscine et jardin, Aïn Diab, Casablanca"
         fetchpriority="high" decoding="async" width="1536" height="1024">
  </div>

  <div class="hero__inner">
    <div class="container">
      <span class="eyebrow eyebrow--light" data-i18n="home.hero.eyebrow"></span>
      <h1 data-i18n="home.hero.title"></h1>
      <p class="hero__text" data-i18n="home.hero.subtitle"></p>
      <div class="btn-row">
        <a class="btn btn--gold" href="proprietes.html" data-i18n="common.viewAll"></a>
        <a class="btn btn--ghost" href="a-propos.html" data-i18n="founder.cta"></a>
      </div>
    </div>
  </div>

  <span class="hero__scroll" data-i18n="home.hero.scroll"></span>
</section>

<!-- ========================================================== SEARCH -->
<div class="search-wrap">
  <div class="container">
    <div class="search-panel">
      <form id="heroSearch" novalidate>
        <div class="field">
          <label class="field__label" for="s-status" data-i18n="search.status"></label>
          <select id="s-status" name="status"></select>
        </div>
        <div class="field">
          <label class="field__label" for="s-city" data-i18n="search.city"></label>
          <select id="s-city" name="city"></select>
        </div>
        <div class="field">
          <label class="field__label" for="s-type" data-i18n="search.type"></label>
          <select id="s-type" name="type"></select>
        </div>
        <button type="submit" class="btn btn--gold" data-i18n="search.submit"></button>
      </form>
    </div>
  </div>
</div>

<!-- ======================================================== FEATURED -->
<section class="section">
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="home.featured.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="home.featured.title"></h2>
      <p class="lead" data-i18n="home.featured.text"></p>
    </div>

    <div class="grid grid--3 cards--featured" id="featuredGrid"></div>

    <div class="btn-row" data-reveal>
      <a class="link-arrow" href="proprietes.html">
        <span data-i18n="common.viewAll"></span>
        <svg width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5h18M14 1l4 4-4 4"/></svg>
      </a>
    </div>
  </div>
</section>

<!-- ======================================================= WHY HOMY -->
<section class="section section--navy">
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="eyebrow eyebrow--light" data-i18n="home.why.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="home.why.title"></h2>
    </div>

    <div class="grid grid--4">
      <article class="feature" data-reveal data-reveal-delay="1">
        <div class="feature__num">01</div>
        <h3 data-i18n="home.why.1.title"></h3>
        <p data-i18n="home.why.1.text"></p>
      </article>
      <article class="feature" data-reveal data-reveal-delay="2">
        <div class="feature__num">02</div>
        <h3 data-i18n="home.why.2.title"></h3>
        <p data-i18n="home.why.2.text"></p>
      </article>
      <article class="feature" data-reveal data-reveal-delay="3">
        <div class="feature__num">03</div>
        <h3 data-i18n="home.why.3.title"></h3>
        <p data-i18n="home.why.3.text"></p>
      </article>
      <article class="feature" data-reveal data-reveal-delay="4">
        <div class="feature__num">04</div>
        <h3 data-i18n="home.why.4.title"></h3>
        <p data-i18n="home.why.4.text"></p>
      </article>
    </div>
  </div>
</section>

<!-- ========================================================= FOUNDER -->
<section class="section">
  <div class="container">
    <div class="founder">
      <div class="founder__media" data-reveal>
        <img src="img/rita-elliaoui.jpg"
             alt="Rita Elliaoui, fondatrice de HOMY Premium Real Estate"
             loading="lazy" decoding="async" width="841" height="1122">
      </div>
      <div data-reveal data-reveal-delay="2">
        <span class="eyebrow" data-i18n="founder.eyebrow"></span>
        <div class="rule"></div>
        <p class="founder__quote" data-i18n="founder.quote"></p>
        <p class="founder__name" data-i18n="founder.name"></p>
        <p class="founder__role" data-i18n="founder.role"></p>
        <p class="lead" data-i18n="founder.text"></p>
        <div class="btn-row">
          <a class="link-arrow" href="a-propos.html">
            <span data-i18n="founder.cta"></span>
            <svg width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5h18M14 1l4 4-4 4"/></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============================================================= CTA -->
<section class="section cta-band">
  <div class="cta-band__media">
    <img src="img/villa-ain-diab-02.jpg"
         alt="" loading="lazy" decoding="async" width="1537" height="1023">
  </div>
  <div class="container">
    <div data-reveal>
      <span class="eyebrow eyebrow--light" data-i18n="cta.eyebrow"></span>
      <div class="rule"></div>
      <h2 data-i18n="cta.title"></h2>
      <p class="lead" style="margin-top:22px" data-i18n="cta.text"></p>
      <div class="btn-row">
        <a class="btn btn--gold" href="contact.html" data-i18n="cta.button"></a>
        <a class="btn btn--ghost" href="proprietes.html" data-i18n="common.viewAll"></a>
      </div>
    </div>
  </div>
</section>

<div data-footer></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/listings-backup.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
