<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — HOMY Premium Real Estate</title>
<meta name="description" content="Contactez HOMY Premium Real Estate, 12 rue Ain El Ati, Triangle d'Or, Casablanca : téléphone, WhatsApp, email et adresse. Réponse sous 24 heures.">
<meta name="theme-color" content="#0A1C2E">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A1C2E'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23C0A062' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="contact" data-title-key="contact.hero.title">

<div data-header></div>

<!-- ===================================================== PAGE HEADER -->
<section class="page-hero">
  <div class="page-hero__media">
    <img src="img/villa-ain-diab-02.jpg"
         alt="Séjour ouvert sur le jardin, villa Aïn Diab" fetchpriority="high" decoding="async" width="1537" height="1023">
  </div>
  <div class="container">
    <nav class="breadcrumb" aria-label="Fil d'Ariane">
      <a href="index.html" data-i18n="nav.home"></a>
      <span>/</span>
      <span data-i18n="nav.contact"></span>
    </nav>
    <span class="eyebrow eyebrow--light" data-i18n="contact.hero.eyebrow"></span>
    <h1 data-i18n="contact.hero.title"></h1>
    <p data-i18n="contact.hero.text"></p>
  </div>
</section>

<!-- ================================================= FORM AND DETAILS -->
<section class="section">
  <div class="container">
    <div class="contact-layout">

      <!-- Form -->
      <div data-reveal>
        <span class="eyebrow" data-i18n="cta.eyebrow"></span>
        <div class="rule"></div>
        <h2 style="margin-bottom:34px" data-i18n="contact.form.title"></h2>

        <!-- Netlify picks this form up automatically once the site is
             published, and emails every message to the account owner.
             No server, no plugin, nothing to configure. -->
        <form id="contactForm" name="contact" method="POST"
              data-netlify="true" netlify-honeypot="bot-field" novalidate>
          <input type="hidden" name="form-name" value="contact">
          <p hidden><label>Ne pas remplir : <input name="bot-field"></label></p>

          <div class="form-grid">
            <div class="form-grid form-grid--2">
              <div class="field">
                <label class="field__label" for="c-name" data-i18n="contact.form.name"></label>
                <input type="text" id="c-name" name="name" required autocomplete="name">
              </div>
              <div class="field">
                <label class="field__label" for="c-email" data-i18n="contact.form.email"></label>
                <input type="email" id="c-email" name="email" required autocomplete="email">
              </div>
            </div>

            <div class="form-grid form-grid--2">
              <div class="field">
                <label class="field__label" for="c-phone" data-i18n="contact.form.phone"></label>
                <input type="tel" id="c-phone" name="phone" autocomplete="tel">
              </div>
              <div class="field">
                <label class="field__label" for="contactSubject" data-i18n="contact.form.subject"></label>
                <select id="contactSubject" name="subject"></select>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="c-message" data-i18n="contact.form.message"></label>
              <textarea id="c-message" name="message" required
                        data-i18n-placeholder="contact.form.messagePlaceholder"></textarea>
            </div>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn--gold" data-i18n="contact.form.submit"></button>
            <a class="btn btn--whatsapp" id="contactWhatsappBtn" href="#" target="_blank" rel="noopener" data-i18n="cta.whatsapp"></a>
          </div>

          <p class="form-note" data-i18n="contact.form.note"></p>
          <p class="form-status" id="formStatus"></p>
        </form>
      </div>

      <!-- Details -->
      <aside data-reveal data-reveal-delay="2">
        <span class="eyebrow" data-i18n="contact.info.title"></span>
        <div class="rule"></div>

        <ul class="info-list">
          <li class="info-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.2a2 2 0 012.1-.5c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>
            <div>
              <div class="info-item__label" data-i18n="contact.info.phone"></div>
              <div class="info-item__value" id="infoPhones"></div>
            </div>
          </li>

          <li class="info-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.2s-.7 1-.9 1.2c-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2"/></svg>
            <div>
              <div class="info-item__label" data-i18n="contact.info.whatsapp"></div>
              <div class="info-item__value"><a id="infoWhatsapp" href="#" target="_blank" rel="noopener"></a></div>
            </div>
          </li>

          <li class="info-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6h20v12H2z"/><path d="M2 7l10 7 10-7"/></svg>
            <div>
              <div class="info-item__label" data-i18n="contact.info.email"></div>
              <div class="info-item__value"><a id="infoEmail" href="#"></a></div>
            </div>
          </li>

          <li class="info-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 22s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="11" r="2.6"/></svg>
            <div>
              <div class="info-item__label" data-i18n="contact.info.address"></div>
              <div class="info-item__value" id="infoAddress"></div>
            </div>
          </li>

          <li class="info-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div>
              <div class="info-item__label" data-i18n="contact.info.hours"></div>
              <div class="info-item__value" id="infoHours"></div>
            </div>
          </li>
        </ul>
      </aside>

    </div>
  </div>
</section>

<!-- ============================================================= MAP -->
<section class="section section--tight section--cream">
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-i18n="contact.map.title"></span>
      <div class="rule"></div>
    </div>
    <div class="map-frame" data-reveal>
      <iframe id="contactMap" title="Carte" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </div>
</section>

<div data-footer></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/listings-backup.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
